# =========================================
# AXORA Backend - Application Configuration
# =========================================

# ---- Database (MySQL via XAMPP) ----
spring.datasource.url=jdbc:mysql://localhost:3306/axora_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8081
server.servlet.context-path=/

# ---- JWT ----
axora.jwt.secret=AxoraSuperSecretKeyForJWTSigning_ChangeThisInProduction_2026
axora.jwt.expiration-ms=86400000

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
axora.upload.dir=uploads

# ---- CORS ----
axora.cors.allowed-origins=http://localhost:5173

# ---- Logging ----
logging.level.com.axora=DEBUG
logging.level.org.springframework.security=INFO
